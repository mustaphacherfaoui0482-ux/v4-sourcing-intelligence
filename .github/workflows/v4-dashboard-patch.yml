name: V4 dashboard patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(dashboard): map potential to potentialScore') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('modules/dashboard-runtime.js')
          s=p.read_text()
          old="evaluateOpportunity({...o,landedCost:o.offer.landedCost,margin:economics.netContributionMargin})"
          new="evaluateOpportunity({...o,potentialScore:o.potential,landedCost:o.offer.landedCost,margin:economics.netContributionMargin})"
          if old not in s:
              raise SystemExit('TARGET_EXPRESSION_NOT_FOUND')
          if new in s:
              raise SystemExit('ALREADY_PATCHED')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/dashboard-runtime.js
          git commit -m "fix(dashboard): map potential to potentialScore"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/v4-dashboard-patch.yml
          git commit -m "chore: remove temporary dashboard patch workflow"
          git push
