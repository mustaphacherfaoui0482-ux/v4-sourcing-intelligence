name: V4 Sourcing Intelligence Tests + GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v4-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f v4-fennec-mark.png
          test -f modules/dashboard-runtime.js
          grep -q "V4 SOURCING INTELLIGENCE" index.html
          grep -q "CONTROL CENTER" index.html
          grep -q "dashboard-runtime.js" index.html
          echo "RELEASE_SHA=$(git rev-parse HEAD)"
          echo "GitHub Pages payload verified"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact repository payload
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy exact payload to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
