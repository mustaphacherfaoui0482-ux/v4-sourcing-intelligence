name: V4 Sourcing Intelligence Tests + GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: v4-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact dashboard patch and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('modules/dashboard-runtime.js')
          s = p.read_text()
          old = "evaluateOpportunity({...o,landedCost:o.offer.landedCost,margin:economics.netContributionMargin})"
          new = "evaluateOpportunity({...o,potentialScore:o.potential,landedCost:o.offer.landedCost,margin:economics.netContributionMargin})"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target occurrence, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git checkout HEAD^ -- .github/workflows/test.yml
          git rm -f .github/workflows/apply-dashboard-patch.yml
          git diff --check
          git diff -- modules/dashboard-runtime.js .github/workflows/test.yml .github/workflows/apply-dashboard-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/dashboard-runtime.js .github/workflows/test.yml .github/workflows/apply-dashboard-patch.yml
          git commit -m 'fix(dashboard): map potential to potentialScore'
          git push origin HEAD:main

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f v4-fennec-mark.png
          test -f modules/dashboard-runtime.js
          grep -q "V4 SOURCING INTELLIGENCE" index.html
          grep -q "CONTROL CENTER" index.html
          grep -q "dashboard-runtime.js" index.html
          echo "RELEASE_SHA=$(git rev-parse HEAD)"
          echo "GitHub Pages payload verified"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact repository payload
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy exact payload to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
