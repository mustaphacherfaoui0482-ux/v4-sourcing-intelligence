name: V4 Sourcing Intelligence Tests + GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: v4-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply UNKNOWN-vs-zero fix on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('modules/dashboard-runtime.js')
          s = p.read_text()
          s = s.replace("offer:{salePrice:0,landedCost:0,variableFees:0,cac:0,targetMargin:30,visitors:0,conversionRate:0},", "offer:{salePrice:null,landedCost:null,variableFees:null,cac:null,targetMargin:30,visitors:null,conversionRate:null},")
          s = s.replace("demandScore:0,sourcingScore:0,profitabilityScore:0,riskScore:0,confidence:0,", "demandScore:null,sourcingScore:null,profitabilityScore:null,riskScore:null,confidence:null,")
          s = s.replace("marketingScore:0,easeOfTest:0,availability:0,potential:0,landedCostScore:0,", "marketingScore:null,easeOfTest:null,availability:null,potential:null,landedCostScore:null,")
          s = s.replace("const money=v=>`${Number(v).toFixed(2).replace('.',',')} €`;", "const money=v=>{if(v===null||v===undefined||v==='')return '—';const n=Number(v);return Number.isFinite(n)?`${n.toFixed(2).replace('.',',')} €`:'—'};")
          s = s.replace("const n=Math.max(0,Math.min(100,Number(score)||0));node.style.background=`conic-gradient(var(--green,#79df31) 0 ${n*3.6}deg,#24302d ${n*3.6}deg)`;setText(node.querySelector('b'),String(Math.round(n)))", "const n=Number(score);if(!Number.isFinite(n)){node.style.background='conic-gradient(#24302d 0 360deg)';setText(node.querySelector('b'),'—');return}const clamped=Math.max(0,Math.min(100,n));node.style.background=`conic-gradient(var(--green,#79df31) 0 ${clamped*3.6}deg,#24302d ${clamped*3.6}deg)`;setText(node.querySelector('b'),String(Math.round(clamped)))")
          s = s.replace("`${state.opportunity.dimensions.potential??0}/100`", "`${state.opportunity.dimensions.potential==null?'UNKNOWN':state.opportunity.dimensions.potential}/100`")
          s = s.replace("`${state.opportunity.dimensions.demand??0}/100`", "`${state.opportunity.dimensions.demand==null?'UNKNOWN':state.opportunity.dimensions.demand}/100`")
          s = s.replace("`${state.opportunity.dimensions.margin??0}%`", "`${state.opportunity.dimensions.margin==null?'UNKNOWN':state.opportunity.dimensions.margin}%`")
          s = s.replace("`${state.opportunity.dimensions.risk??0}/100`", "`${state.opportunity.dimensions.risk==null?'UNKNOWN':state.opportunity.dimensions.risk}/100`")
          p.write_text(s)

          p = Path('tests/dashboard-runtime.test.mjs')
          s = p.read_text()
          s = s.replace("assert.equal(state.economics.inputs.landedCost, 0);", "assert.equal(state.economics.inputs.landedCost, null);")
          s = s.replace("assert.equal(state.opportunity.score, 0);", "assert.equal(state.opportunity.score, null);")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/dashboard-runtime.js tests/dashboard-runtime.test.mjs
          if git diff --cached --quiet; then echo "UNKNOWN-vs-zero fix already applied"; exit 0; fi
          git commit -m "fix: preserve UNKNOWN instead of zero for missing sourcing data"
          git push

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f v4-fennec-mark.png
          test -f modules/dashboard-runtime.js
          grep -q "V4 SOURCING INTELLIGENCE" index.html
          grep -q "CONTROL CENTER" index.html
          grep -q "dashboard-runtime.js" index.html
          echo "RELEASE_SHA=$(git rev-parse HEAD)"
          echo "GitHub Pages payload verified"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact repository payload
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy exact payload to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
