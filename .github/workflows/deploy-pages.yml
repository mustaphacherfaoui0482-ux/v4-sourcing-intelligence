name: Deploy V4 Sourcing Intelligence to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify release payload
        shell: bash
        run: |
          test -f index.html
          test -f v4-fennec-mark.png
          test -f modules/dashboard-runtime.js
          grep -q "V4 SOURCING INTELLIGENCE" index.html
          grep -q "CONTROL CENTER" index.html
          grep -q "dashboard-runtime.js" index.html
          echo "Pages payload verified from main"
          git rev-parse HEAD

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
