name: Apply precise dashboard patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.event.head_commit.message != 'fix(dashboard): map potential to potentialScore'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modules/dashboard-runtime.js')
          s = p.read_text()
          old = "evaluateOpportunity({...o,landedCost:o.offer.landedCost,margin:economics.netContributionMargin})"
          new = "evaluateOpportunity({...o,potentialScore:o.potential,landedCost:o.offer.landedCost,margin:economics.netContributionMargin})"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target occurrence, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify exact diff
        run: git diff --check && git diff -- modules/dashboard-runtime.js

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/dashboard-runtime.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix(dashboard): map potential to potentialScore'
          git push origin HEAD:main
# Trigger commit after workflow creation so GitHub registers the workflow.
